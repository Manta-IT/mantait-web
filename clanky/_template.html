  <style>
  /* =====================================================================
     Clanek -- treti uroven webu, od 8. 9. 2026 v design systemu sluzba.css.
     Telo dodava scripts/clanek_kontrola.py (render) a pouziva tridy
     lp-section, label, hero-*, lp-price, btn, lp-list, lp-facts, lp-table,
     lp-faq, form-note, clanek-obraz. Tady je jejich podoba v nove palete;
     style.css (mustek) se uz nenacita.
     ===================================================================== */
  .skip-link{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--inkoust);color:var(--papir);
    padding:10px 16px;border-radius:var(--r)}
  .skip-link:focus{left:8px}

  main.clanek{max-width:860px;margin:0 auto;padding:0 var(--okraj)}
  .clanek section{padding:0}
  .clanek h1 em,.clanek h2 em{font-style:normal;color:var(--akcent);font-weight:600}
  .clanek h2{font-size:clamp(26px,2.8vw,36px);margin-bottom:16px;max-width:26ch}
  .clanek h3{margin:22px 0 8px}
  .clanek p+p,.clanek p+ul,.clanek ul+p,.clanek p+h3{margin-top:16px}
  .clanek .lp-section>p{max-width:68ch}
  .clanek .lp-section a:not(.btn){color:var(--akcent);text-decoration:underline;
    text-decoration-thickness:1px;text-underline-offset:3px}
  .clanek b{font-weight:600}

  /* Hlava: nad ni je pevna lista 72 px. sluzba.css ma .hero jako mrizku
     pro stranku sluzby, tady je to jeden sloupec. */
  .clanek .hero{display:block;grid-template-columns:none;max-width:none;margin:0;
    padding:124px 0 0}
  .clanek .hero-eyebrow,.clanek .label{display:inline-block;font-family:var(--mono);font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--tlum);margin-bottom:18px}
  .clanek .hero-eyebrow{color:var(--akcent)}
  .clanek h1{font-size:clamp(34px,4.6vw,58px);max-width:20ch}
  .clanek .hero-lead{margin-top:20px;font-size:clamp(17px,1.3vw,19px);color:var(--tlum);max-width:60ch}
  .clanek .form-note{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;color:var(--tlum)}
  .clanek .clanek-obraz{display:block;width:min(100%,420px);height:auto;margin-top:32px}

  .clanek .lp-section{padding:clamp(36px,4.5vw,56px) 0 0}

  .clanek .lp-list{list-style:none;margin-top:10px;max-width:68ch}
  .clanek .lp-list li{position:relative;padding:10px 0 10px 26px;border-bottom:1px solid var(--linka)}
  .clanek .lp-list li::before{content:'';position:absolute;left:2px;top:19px;width:8px;height:8px;
    border-radius:2px;background:var(--akcent)}

  .clanek .lp-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:22px}
  .clanek .lp-fact{background:var(--papir-tmav);border:1px solid var(--linka);border-radius:var(--r-s);padding:18px 20px}
  .clanek .lp-fact b{display:block;font-family:var(--display);font-weight:500;font-size:26px;
    letter-spacing:-.03em;color:var(--akcent);line-height:1.2}
  .clanek .lp-fact span{font-size:13.5px;color:var(--tlum)}

  .clanek .lp-table-wrap{overflow-x:auto;margin-top:18px}
  .clanek .lp-table{width:100%;border-collapse:collapse;font-size:15px}
  .clanek .lp-table th{text-align:left;padding:12px 14px;font-family:var(--mono);font-weight:500;font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--tlum);border-bottom:1px solid var(--inkoust);white-space:nowrap}
  .clanek .lp-table td{padding:12px 14px;border-bottom:1px solid var(--linka);vertical-align:top}

  /* FAQ: details a summary stylovane v sluzba.css (bez .znak-plus), znamenko tady. */
  .clanek .lp-faq{margin-top:10px}
  .clanek .lp-faq summary::after{content:'+';font-family:var(--display);font-size:24px;line-height:1;color:var(--akcent);
    transition:transform .28s var(--krivka)}
  .clanek .lp-faq details[open] summary::after{transform:rotate(45deg)}
  .clanek .lp-faq p{padding:0 0 22px;color:var(--tlum);max-width:66ch}

  .clanek .btn{background:var(--inkoust);color:var(--papir)}
  .clanek .lp-price{background:var(--inkoust);color:var(--papir);border-radius:var(--r-l);
    padding:clamp(24px,3vw,34px) clamp(22px,3vw,36px);margin-top:26px}
  .clanek .lp-price p{color:color-mix(in srgb,var(--papir) 72%,transparent);max-width:none}
  .clanek .lp-price b{color:var(--papir);font-family:var(--display);font-weight:400;
    font-size:clamp(20px,2vw,26px);letter-spacing:-.02em;line-height:1.3}
  .clanek .lp-price .btn{background:var(--papir);color:var(--inkoust)}
  .clanek .lp-price .big{font-family:var(--display);font-size:42px;letter-spacing:-.03em;color:var(--papir);line-height:1.1}

  /* Souvisejici sluzby: sklada render z meta.sluzby a web/sluzby.json (E9). */
  .lp-souvisejici{margin:56px 0 72px}
  .lp-souvisejici-label{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--tlum);margin-bottom:14px}
  .lp-souvisejici ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--linka)}
  .lp-souvisejici li{border-bottom:1px solid var(--linka)}
  .lp-souvisejici a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;padding:16px 0;
    text-decoration:none;color:var(--inkoust)}
  .lp-souvisejici b{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.02em}
  .lp-souvisejici span{font-size:15px;color:var(--tlum);grid-column:1}
  .lp-souvisejici small{font-family:var(--mono);font-size:12.5px;color:var(--akcent);white-space:nowrap;grid-row:1;grid-column:2}

  footer{margin-top:0}

  @media (hover:hover) and (pointer:fine){
    .clanek .btn:hover{background:var(--akcent)}
    .clanek .lp-price .btn:hover{background:var(--akcent-sv)}
    .lp-souvisejici a:hover b{text-decoration:underline;text-underline-offset:4px}
  }
  @media (max-width:600px){
    .clanek .hero{padding-top:104px}
    .lp-souvisejici a{grid-template-columns:1fr}
    .lp-souvisejici small{grid-row:auto;grid-column:1}
  }
  </style>
</head>
