<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Enterprise AI portal — prototype</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F6F7F7; --surface:#FFF; --surface-2:#FAFBFB;
  --ink:#14181A; --ink-2:#4E585C; --ink-3:#788388;
  --line:#E3E7E8; --line-2:#C7CED0;
  --acc:#0F5E6B; --acc-soft:#E5F0F1; --acc-dk:#0C4C57;
  --ok:#1C6B45; --ok-soft:#E4F0EA;
  --wait:#7E5A0E; --wait-soft:#F6EEDC;
  --err:#933B28; --err-soft:#F6E7E3;
  --r-s:8px; --r:10px; --r-l:14px;
  --e:cubic-bezier(.23,1,.32,1);
  --demo:#2E2A45; --rail:250px;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono,code{font-family:ui-monospace,monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}

.demo{background:var(--demo);color:#EDEBF5;padding:8px clamp(12px,2vw,20px);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:60}
.demo b{font-weight:600;font-size:12.5px}
.demo .h{font-size:12px;color:rgba(237,235,245,.68);flex:1 1 240px;min-width:0}
.demo select{background:rgba(237,235,245,.12);color:#EDEBF5;border:1px solid rgba(237,235,245,.26);
  border-radius:var(--r-s);padding:7px 10px;font:inherit;font-size:12.5px;min-height:36px;max-width:100%}
.demo select option{background:var(--demo);color:#EDEBF5}
.demo .jump{background:none;border:1px solid rgba(237,235,245,.26);color:#EDEBF5;border-radius:6px;
  padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
.demo .persona{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;min-width:0;max-width:100%}
.demo .persona span{font-size:11.5px;color:rgba(237,235,245,.6);white-space:nowrap}

.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:calc(100vh - 50px)}
@media(max-width:940px){.shell{grid-template-columns:1fr}}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:16px 0 40px;
  position:sticky;top:50px;align-self:start;max-height:calc(100vh - 50px);overflow-y:auto}
@media(max-width:940px){.rail{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line)}}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px 14px}
.mark{width:25px;height:25px;border-radius:6.8px;background:var(--acc);position:relative;flex:none}
.mark::after{content:"";position:absolute;top:6.8px;right:6.8px;width:9.1px;height:9.1px;border-radius:2.3px;background:var(--surface)}
.brand b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.brand .up{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-3);text-align:right;line-height:1.3}
.navgrp{padding:0 9px}
.navgrp .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);padding:13px 8px 5px}
.rail nav{display:grid;gap:1px}
.rail nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 9px;border-radius:var(--r-s);font-size:13.5px;min-height:38px;color:var(--ink-2);
  transition:background .16s var(--e),color .16s var(--e)}
.rail nav button .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;
  padding:1px 6px;border-radius:20px;background:var(--line);color:var(--ink-2)}
.rail nav button .c.hot{background:var(--err-soft);color:var(--err)}
.rail nav button .c.warm{background:var(--wait-soft);color:var(--wait)}
.rail nav button[aria-current="true"]{background:var(--acc-soft);color:var(--acc-dk);font-weight:600}
@media(hover:hover) and (pointer:fine){.rail nav button:hover{background:var(--surface-2);color:var(--ink)}
  .rail nav button[aria-current="true"]:hover{background:var(--acc-soft);color:var(--acc-dk)}}
.rail .foot{padding:14px 16px 0;margin-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.5}

.main{padding:24px clamp(14px,2.6vw,32px) 80px;max-width:1200px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-bottom:20px}
.head h2{font-size:clamp(19px,2.5vw,25px);font-weight:600;letter-spacing:-.02em;line-height:1.2}
.head p{color:var(--ink-2);font-size:14px;max-width:66ch;margin-top:4px}
.head .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--acc-soft);color:var(--acc);
  display:grid;place-items:center;font-size:10.5px;font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.planovano{border-style:dashed;border-color:var(--line-2)}
.card>h3{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:14px 16px 0}
.card>h3 .n{color:var(--ink-2);text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px}
.card .body{padding:14px 16px 16px}
.card .body.tight{padding-top:4px}
.grid{display:grid;gap:14px}
@media(min-width:960px){.g21{grid-template-columns:1.5fr 1fr}.g11{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}.g12{grid-template-columns:1fr 1.5fr}}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;
  font-size:10px;padding:3px 7px;border-radius:5px;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-wait{background:var(--wait-soft);color:var(--wait)}
.t-err{background:var(--err-soft);color:var(--err)} .t-off{background:#ECEFEF;color:var(--ink-2)}
.t-acc{background:var(--acc-soft);color:var(--acc-dk)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.btn{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 13px;font-size:13px;
  font-weight:500;min-height:40px;transition:border-color .18s var(--e),background .18s var(--e)}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-s{padding:5px 10px;min-height:32px;font-size:12px}
@media(hover:hover) and (pointer:fine){.btn:hover{border-color:var(--ink-2);background:var(--surface-2)}
  .btn-p:hover{background:var(--acc-dk);border-color:var(--acc-dk)}}
.btn:active{transform:translateY(1px);transition-duration:.16s}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .xs{font-size:12px}
.src{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:0 9px 8px 0;
  border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 9px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t td .s2{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
table.t td.num{font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap}
table.t td.rt{text-align:right}
.clickrow{cursor:pointer}
@media(hover:hover) and (pointer:fine){.clickrow:hover td{background:var(--surface-2)}}
.scroll{overflow-x:auto}

.note{margin-top:22px;border-left:2px solid var(--line-2);padding-left:13px;font-size:12px;
  color:var(--ink-3);max-width:76ch;line-height:1.6}
.note b{color:var(--ink-2);font-weight:600}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.tabs button{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 13px;font-size:13px;
  font-weight:500;min-height:38px;transition:background .18s var(--e)}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
@media(hover:hover) and (pointer:fine){.tabs button:hover{background:var(--surface-2)}
  .tabs button[aria-pressed="true"]:hover{background:var(--ink)}}

.pill{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line-2);
  border-radius:20px;padding:4px 10px;font-size:12px}
.pill b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.bar i.warn{background:var(--wait)} .bar i.bad{background:var(--err)}
.big{font-size:clamp(30px,4.4vw,42px);font-weight:600;letter-spacing:-.03em;line-height:1}
.big span{font-size:.4em;font-weight:500;color:var(--ink-2)}
.trend{display:flex;align-items:flex-end;gap:4px;height:52px;margin-top:12px}
.trend i{flex:1;background:var(--acc-soft);border-radius:3px 3px 0 0;display:block}
.trend i:last-child{background:var(--acc)}
.trend-x{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;color:var(--ink-3);margin-top:5px}

.tiles{display:grid;gap:12px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}}
.tile{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);padding:15px;
  text-align:left;width:100%;transition:border-color .18s var(--e)}
@media(hover:hover) and (pointer:fine){button.tile:hover{border-color:var(--acc)}}
.tile .k{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.tile h4{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
.tile .d{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.tile .m{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:6px}

/* chat */
.chat{display:grid;grid-template-rows:1fr auto;border:1px solid var(--line);
  border-radius:var(--r-l);background:var(--surface);overflow:hidden;min-height:520px}
.chat .thread{padding:18px;display:grid;gap:16px;align-content:start;overflow-y:auto;max-height:56vh}
.msg{display:grid;gap:6px;max-width:74ch}
.msg .m-who{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}
.msg .m-b{font-size:14.5px;line-height:1.6}
.msg.me{justify-self:end;text-align:left}
.msg.me .m-b{background:var(--acc-soft);border-radius:var(--r-l) var(--r-l) 4px var(--r-l);padding:11px 14px}
.msg.me .m-who{text-align:right}
.msg.ai .m-b{border-left:2px solid var(--acc);padding-left:14px}
.msg .m-ref{margin-top:8px;display:grid;gap:5px}
.msg .m-ref a{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--acc);
  text-decoration:none;border-bottom:1px solid var(--acc-soft);width:fit-content}
.msg .m-act{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chat .compose{border-top:1px solid var(--line);padding:12px 14px;background:var(--surface-2)}
.chat .compose .in{display:flex;gap:8px;align-items:flex-end}
.chat textarea{flex:1;min-height:46px;max-height:130px;padding:12px;font:inherit;font-size:14.5px;
  border:1px solid var(--line-2);border-radius:var(--r);resize:vertical;background:var(--surface);color:var(--ink)}
.chat .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.chat .tools .sep{flex:1}
.attach{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line-2);
  border-radius:var(--r);padding:6px 10px;font-size:12px;color:var(--ink-2);min-height:34px}
.ctx{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--surface-2);align-items:center}
.ctx .lb{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-right:2px}

/* dept header */
.dhead{border:1px solid var(--line);border-radius:var(--r-l);background:linear-gradient(180deg,var(--acc-soft),var(--surface) 70%);
  padding:18px;margin-bottom:14px}
.dhead h3{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.dhead .who2{font-size:13px;color:var(--ink-2)}
.dhead .stats{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(0,0,0,.06)}
.dhead .stats div{min-width:78px}
.dhead .stats .v{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1}
.dhead .stats .l{font-size:11.5px;color:var(--ink-2);margin-top:3px}

.people{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:4px 11px 4px 4px;font-size:12.5px;background:var(--surface)}
.chip i{width:22px;height:22px;border-radius:50%;background:var(--acc-soft);color:var(--acc);
  display:grid;place-items:center;font-size:9.5px;font-weight:700;font-style:normal;flex:none}
.chip.multi{border-color:var(--acc);background:var(--acc-soft)}

.flagbox{border:1px solid var(--line);border-radius:var(--r);padding:13px;background:var(--surface-2)}
.flagbox+.flagbox{margin-top:9px}
.flagbox .fh{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.flagbox .fq{font-size:14px;font-weight:500;flex:1}
.flagbox p{font-size:13px;color:var(--ink-2);max-width:70ch}
.flagbox .fr{margin-top:9px;border-left:2px solid var(--ok);padding-left:11px;font-size:12.5px;color:var(--ink-2)}
.acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}

.mtx{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
.mtx th{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:0 7px 8px;border-bottom:1px solid var(--line);text-align:center}
.mtx th:first-child{text-align:left}
.mtx td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:center}
.mtx td:first-child{text-align:left;font-size:13px}
.mtx tr:last-child td{border-bottom:none}
.p{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:5px}
.p-rw{background:var(--acc-soft);color:var(--acc-dk)} .p-r{background:#ECEFEF;color:var(--ink-2)}
.p-no{color:var(--ink-3)}

.log{list-style:none}
.log li{display:grid;grid-template-columns:auto auto 1fr;gap:11px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
.log li:last-child{border-bottom:none}
.log .tm{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.log .wh{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:5px;
  background:var(--line);color:var(--ink-2);white-space:nowrap}
.log .wh.a{background:var(--acc-soft);color:var(--acc-dk)}
.log .wh.h{background:var(--ok-soft);color:var(--ok)}
.log .wh.x{background:var(--err-soft);color:var(--err)}
@media(max-width:660px){.log li{grid-template-columns:1fr}}

.mach{display:grid;gap:13px}
@media(min-width:920px){.mach{grid-template-columns:1.25fr 1fr 1fr}}
.box{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);padding:15px}
.box.lead{border-color:var(--acc);background:linear-gradient(180deg,var(--acc-soft),var(--surface) 62%)}
.box .role{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.box h4{font-size:15.5px;font-weight:600;margin-bottom:3px}
.box .spec{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);margin-bottom:12px}
.box ul{list-style:none;display:grid;gap:6px;font-size:12.5px}
.box ul li{display:flex;gap:7px;align-items:baseline}
.box ul li .d2{width:5px;height:5px;border-radius:50%;background:var(--acc);flex:none;margin-top:6px}
.meter{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.meter .spread{font-size:11.5px;margin-bottom:4px}

.files{display:grid;gap:9px}
@media(min-width:900px){.files{grid-template-columns:repeat(3,1fr)}}
.file{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.file .fh2{display:flex;gap:8px;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line);background:var(--surface)}
.file .fn{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-2)}
.file .fr2{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-3)}
.file pre{padding:10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.6;
  color:var(--ink-2);overflow-x:auto;white-space:pre}
.file pre .k2{color:var(--acc)} .file pre .c2{color:var(--ink-3)}
.diff{font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.7;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.diff div{padding:2px 10px}
.diff .add{background:var(--ok-soft);color:var(--ok)} .diff .del{background:var(--err-soft);color:var(--err)}
.diff .ctx2{color:var(--ink-3)}
.sw{position:relative;width:40px;height:24px;border-radius:12px;background:var(--line-2);flex:none;transition:background .2s var(--e)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .2s var(--e);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
</style>
</head>
<body>

<div class="demo">
  <b>Prototype</b>
  <span class="h">Demo: none of this is running and the data are fictional. The platform is set up as if it had been running since February, with everything it would have collected by now.</span>
  <button class="jump" data-v="uvod">Guide</button>
  <button class="jump" data-v="dal">What next</button>
  <div class="persona">
    <span>systems</span>
    <select id="sysSel" aria-label="Which systems the company uses">
      <option value="0">RAYNET + POHODA + iDoklad</option>
      <option value="1">HubSpot + HELIOS iNuvio + Fakturoid</option>
      <option value="2">Pipedrive + ABRA Gen + iDoklad</option>
      <option value="3">Salesforce + SAP Business One + iDoklad</option>
    </select>
    <span>scope</span>
    <select id="scopeSel" aria-label="Choose deployment scope">
      <option value="platforma">Platform — whole company</option>
      <option value="pricka1">Step 1 — one workflow</option>
    </select>
    <span>signed in as</span>
    <select id="personaSel" aria-label="Choose signed-in person"></select>
  </div>
</div>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span><b>Platform</b>
      <span class="up" id="upTime">running 210 days<br>since Feb 12, 2026</span>
    </div>
    <div id="nav"></div>
    <div class="foot" id="railFoot"></div>
  </aside>

  <main class="main">
    <div class="head">
      <div><h2 id="vTitle"></h2><p id="vSub"></p></div>
      <div class="who"><span id="whoName"></span><span class="avatar" id="whoInit"></span></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
(function(){
/* ==================================================================
   DATA — celá firma jako jeden objekt. Přidat další ERP nebo oddělení
   je řádek tady, ne nová obrazovka.
   ================================================================== */

/* Sestava systemu. Prototyp nesmi stat na jedne kombinaci -- akceleracni vrstva
   lezi NAD tim, co firma uz ma. Prohozeni je swap, ne replace, aby se nazev
   neobjevil dvakrat (jednou napojeny, jednou v katalogu). */
var SADY = [
  ['RAYNET','POHODA','iDoklad'],
  ['HubSpot','HELIOS iNuvio','Fakturoid'],
  ['Pipedrive','ABRA Gen','iDoklad'],
  ['Salesforce','SAP Business One','iDoklad']
];
var sada = 0;
function swap(h, a, b){
  if(a === b) return h;
  return h.split(a).join('').split(b).join(a).split('').join(b);
}
function prejmenuj(h){
  if(sada === 0) return h;
  for(var i = 0; i < 3; i++) h = swap(h, SADY[0][i], SADY[sada][i]);
  return h;
}

function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

var M = { token: (typeof window.PRISTUP_T === 'string' && window.PRISTUP_T) ? window.PRISTUP_T : null, fronta: [] };
function mereniZapis(v, o){
  if(!M.token) return;
  M.fronta.push({v: String(v).slice(0,40), o: String(o||'').slice(0,20), ts: Date.now()});
  if(M.fronta.length >= 50) mereniOdesli('plna');
}
function mereniOdesli(duvod){
  if(!M.token || !M.fronta.length) return;
  if(typeof navigator === 'undefined' || !navigator.sendBeacon) return;
  navigator.sendBeacon('/mereni', JSON.stringify({t: M.token, u: M.fronta.splice(0, 50)}));
}
if(M.token){
  setInterval(function(){ mereniOdesli('interval'); }, 10000);
  window.addEventListener('pagehide', function(){ mereniOdesli('pagehide'); });
}
