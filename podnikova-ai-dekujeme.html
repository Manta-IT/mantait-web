  <style>
:root {
  --papir: #FBFBF9; --inkoust: #101413;
  --akcent: #0B6E4F; --tlum: #5E6663;
  --disp: 'Outfit', system-ui, sans-serif;
  --ui: 'Manrope', system-ui, sans-serif;
  --kriv: cubic-bezier(.23, 1, .32, 1);
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--papir); color: var(--inkoust);
  font: 400 15.5px/1.6 var(--ui); -webkit-font-smoothing: antialiased; }

.horni-nav { display: flex; align-items: center; justify-content: space-between;
  max-width: 1040px; margin: 0 auto; padding: 18px 24px; }
.horni-nav .brand { display: inline-flex; align-items: center; gap: 11px;
  color: var(--inkoust); text-decoration: none;
  font: 600 17px var(--disp); letter-spacing: -.01em; }
.znak { width: 30px; height: 30px; display: block; }
.horni-nav .zpet-web { color: var(--tlum); text-decoration: none;
  font: 500 13.5px var(--ui); border-bottom: 1px solid transparent;
  transition: color 200ms var(--kriv); }
@media (hover: hover) { .horni-nav .zpet-web:hover { color: var(--akcent); } }

.hero { max-width: 1040px; margin: 0 auto; padding: 64px 24px 48px; }
.hero h1 { font: 400 clamp(34px, 5vw, 52px)/1.06 var(--disp);
  letter-spacing: -.03em; max-width: 17ch; }
.hero h1 em { font-style: normal; color: var(--akcent); font-weight: 500; }
.hero .perex { margin-top: 18px; max-width: 58ch; color: var(--tlum);
  font-size: 16.5px; }

footer { max-width: 1040px; margin: 0 auto; padding: 26px 24px 34px;
  display: flex; flex-wrap: wrap; gap: 8px 28px; justify-content: space-between;
  color: var(--tlum); font-size: 12.5px; }
footer .fb { font: 600 14px var(--disp); color: var(--inkoust); }
footer .fb span { color: var(--akcent); }
</style>
